server:
  port: 8087

spring:
  application:
    name: order-service
  config:
    import:
      - optional:nacos:backend-common.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}&refreshEnabled=true


  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.3.36:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
      config:
        server-addr: ${NACOS_SERVER_ADDR:192.168.3.36:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        group: ${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
        namespace: ${NACOS_CONFIG_NAMESPACE:}
        file-extension: yaml

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  type-aliases-package: com.duanyan.taopiaopiao.orderservice.domain.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

seata:
  enabled: true
  tx-service-group: ${SEATA_TX_GROUP:tpp_tx_group}
  enable-auto-data-source-proxy: false
  transport:
    enable-client-batch-send-request: false
  registry:
    type: nacos
    nacos:
      application: ${SEATA_APPLICATION:seata-server}
      server-addr: ${NACOS_SERVER_ADDR:192.168.3.36:8848}
      group: ${SEATA_REGISTRY_GROUP:DEFAULT_GROUP}
      namespace: ${NACOS_CONFIG_NAMESPACE:}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
  service:
    vgroup-mapping:
      tpp_tx_group: ${SEATA_CLUSTER:default}
