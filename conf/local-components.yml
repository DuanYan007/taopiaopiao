# Single-node local runtime component inventory.
# This file is for development coordination and Codex context, not production deployment.

environment: local-single-node

backend:
  repository: /home/duanyan/project/taopiaopiao-backend
  java_version: 17
  build_tool: maven

frontend:
  source_repository: /home/duanyan/project/taopiaopiao-frontend
  deployed_static_root: /usr/local/openresty/nginx/html

components:
  mysql:
    role: business persistence
    host: 127.0.0.1
    port: 3306
    database: taopiaopiao
    username: root
    password_env: MYSQL_PASSWORD
    notes:
      - MySQL orders table is the durable source for formal order state.

  redis:
    role: hot-path seat state, temporary locks, lock-order aggregate, processing cache, Redis Stream
    host: 127.0.0.1
    port: 6349
    password_env: REDIS_PASSWORD
    loadtest_profile: scripts/loadtest/redis-loadtest.conf.example
    notes:
      - Redis is the runtime truth for lock-seat admission.
      - Large local burst tests should use the dedicated load-test profile, not a minimal default config.

  nacos:
    role: service discovery
    host: 127.0.0.1
    port: 8848
    notes:
      - Java services rely on local service discovery during integrated runs.

  rocketmq:
    role: async events, transactional messages, delayed timeout checks
    nameserver: 127.0.0.1:9876
    notes:
      - Used for LOCK_ACCEPTED, ORDER_CREATED_INTERNAL, ORDER_PAID, TIMEOUT_CHECK, and cancel convergence events.

  openresty:
    role: frontend entry, API routing, seckill gate
    root: /usr/local/openresty/nginx
    route_config: /usr/local/openresty/nginx/conf/app.conf
    gate_lua: /usr/local/openresty/nginx/lua/seckill_gate.lua
    static_root: /usr/local/openresty/nginx/html
    access_log: /usr/local/openresty/nginx/logs/tpp_access.log
    notes:
      - Gate logic applies to all valid sessionId values.
      - sessionId=1 has an additional static hotspot override.
      - Current local lock_only_burst tuning baseline uses sessionId=2.

  mock_payment:
    role: local payment creation, query, and simulated success
    repository: /home/duanyan/project/taopiaopiao-backend/taopiaopiao-payment-system
    notes:
      - Required for end-to-end payment flow verification.

tools:
  docker:
    role: local infrastructure runtime
    notes:
      - MySQL, Redis, and Nacos are commonly run as local containers.

  k6:
    role: pressure testing
    scripts: scripts/loadtest
    runner: bin/run-lock-only-burst.sh
    notes:
      - Prefer the repository runner for lock_only_burst so logs are captured under logs/loadtest.

  maven:
    role: build and verification
    commands:
      compile_all: mvn -q -DskipTests compile
      validate_boundaries: mvn -q validate
