lua_shared_dict seckill_gate 10m;
lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

log_format tpp_main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time request_id=$sent_http_x_request_id x_user_id=$http_x_user_id';

upstream gateway_backend {
    server 127.0.0.1:8080;
    keepalive 512;
}

server {
    listen 80 reuseport backlog=8192;
    access_log logs/tpp_access.log tpp_main;

    location = /internal/seckill/gate/status {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        content_by_lua_block {
            require("seckill_gate").status()
        }
    }

    location = /internal/seckill/gate/config {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        content_by_lua_block {
            require("seckill_gate").update_config()
        }
    }

    location = /internal/seckill/gate/reset {
        allow 127.0.0.1;
        allow ::1;
        deny all;

        content_by_lua_block {
            require("seckill_gate").reset_session()
        }
    }

    location = /api/seckill/lock {
        client_max_body_size 10M;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        access_by_lua_block {
            require("seckill_gate").run()
        }

        header_filter_by_lua_block {
            if ngx.ctx.seckill_gate_request_id then
                ngx.header["X-Request-Id"] = ngx.ctx.seckill_gate_request_id
            end
            require("seckill_gate").release_inflight()
        }

        body_filter_by_lua_block {
            require("seckill_gate").capture_upstream_result()
        }

        log_by_lua_block {
            require("seckill_gate").release_inflight()
        }

        proxy_pass http://gateway_backend/seckill/lock;
    }

    location /api/ {
        client_max_body_size 10M;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_pass http://gateway_backend/;
    }

    location = / {
        return 301 /admin/;
    }

    location /admin/ {
        alias html/admin/;
        index admin-index.html;
        try_files $uri $uri/ admin-index.html;
    }

    location /client/ {
        alias html/client/;
        try_files $uri $uri/ client-index.html;
    }

    location /assets/ {
        root html;
    }

    location /favicon.ico {
        root html;
    }
}
